<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7dff"/>
      <stop offset=".55" stop-color="#7b5cff"/>
      <stop offset="1" stop-color="#b061ff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- squircle tile -->
  <rect x="16" y="16" width="480" height="480" rx="124" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="124" fill="url(#shine)"/>
  <!-- U = a screen bezel: two endpoints are the two connected desks -->
  <path d="M164 132v124a92 92 0 0 0 184 0V132" fill="none" stroke="#fff" stroke-width="58" stroke-linecap="round"/>
  <!-- link signal between the two desks -->
  <path d="M214 196a58 58 0 0 1 84 0" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="22" stroke-linecap="round"/>
  <circle cx="256" cy="236" r="15" fill="#fff" fill-opacity=".85"/>
  <!-- desk stand -->
  <path d="M196 418h120" stroke="#fff" stroke-width="30" stroke-linecap="round"/>
</svg>
