# coturn config for UniDesk. Replace the CHANGE_ME values before starting.
listening-port=3478
tls-listening-port=5349
min-port=49160
max-port=49200
fingerprint
lt-cred-mech
realm=unidesk
# username:password that UniDesk users enter in Settings → Network
user=unidesk:CHANGE_ME_TO_A_LONG_RANDOM_PASSWORD
# your server's public IP address
external-ip=CHANGE_ME_PUBLIC_IP
# block relaying into private networks (prevents abuse of your server)
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
no-cli
